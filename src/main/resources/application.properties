# 1. Database Connection (Change 'password' to your real MySQL password)
spring.datasource.url=jdbc:mysql://localhost:3306/greennest_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=password

# 2. JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 3. Error Handling (To avoid the ugly White Label Error page)
server.error.include-message=always

# 4. Port (Standard is 8080)
server.port=8080