# --- DIGITAL OCEAN CONFIGURATION ---
# Host: db-mysql-sgp1... | Port: 25060
spring.datasource.url=${DATABASE_URL:jdbc:mysql://db-mysql-sgp1-89626-do-user-27328078-0.k.db.ondigitalocean.com:25060/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${DATABASE_USERNAME:doadmin}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / HIBERNATE ---
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- APP SETTINGS ---
server.port=8080

# --- FILE UPLOAD SETTINGS ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- FILE STORAGE CONFIGURATION ---
# Mode: auto (uses local if Spaces not configured), local (always local), cloud (always cloud)
file.storage.mode=auto
# Local upload directory (relative to project root)
file.upload-dir=src/main/resources/static/uploads

# --- DIGITALOCEAN SPACES CONFIGURATION ---
do.spaces.key=${DO_SPACES_KEY}
do.spaces.secret=${DO_SPACES_SECRET}
do.spaces.endpoint=${DO_SPACES_ENDPOINT:sgp1.digitaloceanspaces.com}
do.spaces.region=${DO_SPACES_REGION:sgp1}
do.spaces.bucket=${DO_SPACES_BUCKET:nboard}
