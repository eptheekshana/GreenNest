# --- DATABASE CONFIGURATION ---
# Uses environment variables for secure configuration
# For production: Set DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD
# For development: Configure in .env file (not committed to git)
spring.datasource.url=${DATABASE_URL:${JDBC_DATABASE_URL:jdbc:mysql://139.59.237.242:3306/nboard}}

# Default fallback username for the MySQL server
spring.datasource.username=${DATABASE_USERNAME:${JDBC_DATABASE_USERNAME:heroku_user}}

# SECURED: Default fallback - Password MUST be set via environment variables
spring.datasource.password=${DATABASE_PASSWORD:${JDBC_DATABASE_PASSWORD:}}

spring.datasource.driver-class-name=${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}

# H2 Console (disabled by default, enable only for development if using H2)
spring.h2.console.enabled=false

# --- JPA / HIBERNATE ---
spring.jpa.database-platform=${DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- APP SETTINGS ---
server.port=${PORT:8080}

# --- SESSION STORAGE (HEROKU SAFE) ---
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework

# --- FILE UPLOAD SETTINGS ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# --- FILE STORAGE CONFIGURATION ---
# Mode: auto (uses local if Spaces not configured), local (always local), cloud (always cloud)
file.storage.mode=${FILE_STORAGE_MODE:auto}
# Local upload directory (relative to project root)
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# --- DIGITALOCEAN SPACES CONFIGURATION ---
# Never commit these values! Use .env file or environment variables
do.spaces.key=${DO_SPACES_KEY:}
do.spaces.secret=${DO_SPACES_SECRET:}
do.spaces.endpoint=${DO_SPACES_ENDPOINT:sgp1.digitaloceanspaces.com}
do.spaces.region=${DO_SPACES_REGION:sgp1}
do.spaces.bucket=${DO_SPACES_BUCKET:nboard}

# --- JWT CONFIGURATION ---
# Provide JWT_SECRET through environment variables for production.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- SMTP / EMAIL OTP VERIFICATION ---
spring.mail.host=${SPRING_MAIL_HOST:smtp.sendgrid.net}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:apikey}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

mail.from.email=${MAIL_FROM_EMAIL:no-reply@nboard.com}
mail.from.name=${MAIL_FROM_NAME:Nboard}

verification.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:10}
verification.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:30}
verification.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
