# --- DATABASE CONFIGURATION ---
# Uses environment variables for secure configuration
# For production: Set DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD
# For development: Configure in .env file (not committed to git)
spring.datasource.url=${DATABASE_URL:${JDBC_DATABASE_URL:jdbc:mysql://139.59.237.242:3306/nboard}}

# Default fallback username for the MySQL server
spring.datasource.username=${DATABASE_USERNAME:${JDBC_DATABASE_USERNAME:heroku_user}}

# SECURED: Default fallback set from the provided database password
spring.datasource.password=${DATABASE_PASSWORD:${JDBC_DATABASE_PASSWORD:Theekshana@0618}}

spring.datasource.driver-class-name=${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}

# H2 Console (disabled by default, enable only for development if using H2)
spring.h2.console.enabled=false

# --- JPA / HIBERNATE ---
spring.jpa.database-platform=${DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- APP SETTINGS ---
server.port=${PORT:8080}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# --- EMAIL / SENDGRID ---
# IMPORTANT: Never hardcode API key! Use environment variables or .env file
sendgrid.api-key=${SENDGRID_API_KEY:}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:no-reply@nboard.com}
sendgrid.from-name=${SENDGRID_FROM_NAME:Nboard}
sendgrid.data-residency=${SENDGRID_DATA_RESIDENCY:eu}

# --- SESSION STORAGE (HEROKU SAFE) ---
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework

# --- FILE UPLOAD SETTINGS ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# --- FILE STORAGE CONFIGURATION ---
# Mode: auto (uses local if Spaces not configured), local (always local), cloud (always cloud)
file.storage.mode=${FILE_STORAGE_MODE:auto}
# Local upload directory (relative to project root)
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# --- DIGITALOCEAN SPACES CONFIGURATION ---
# Never commit these values! Use .env file or environment variables
do.spaces.key=${DO_SPACES_KEY:}
do.spaces.secret=${DO_SPACES_SECRET:}
do.spaces.endpoint=${DO_SPACES_ENDPOINT:sgp1.digitaloceanspaces.com}
do.spaces.region=${DO_SPACES_REGION:sgp1}
do.spaces.bucket=${DO_SPACES_BUCKET:nboard}

# --- JWT CONFIGURATION ---
# Use a long random secret in production via JWT_SECRET env var.
jwt.secret=${JWT_SECRET:Q29paWxvdE5ib2FyZFNlY3JldEtleUZvclNIQTI1NlRva2VuR2VuZXJhdGlvbg==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}