# --- DATABASE CONFIGURATION ---
# For production: Use DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD env vars
# For development: Falls back to H2 in-memory database if MySQL not available
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:nboard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.h2.console.enabled=true

# --- JPA / HIBERNATE ---
spring.jpa.database-platform=${DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# --- APP SETTINGS ---
server.port=${PORT:8080}

# --- FILE UPLOAD SETTINGS ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- FILE STORAGE CONFIGURATION ---
# Mode: auto (uses local if Spaces not configured), local (always local), cloud (always cloud)
file.storage.mode=auto
# Local upload directory (relative to project root)
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# --- DIGITALOCEAN SPACES CONFIGURATION ---
do.spaces.key=${DO_SPACES_KEY:}
do.spaces.secret=${DO_SPACES_SECRET:}
do.spaces.endpoint=${DO_SPACES_ENDPOINT:sgp1.digitaloceanspaces.com}
do.spaces.region=${DO_SPACES_REGION:sgp1}
do.spaces.bucket=${DO_SPACES_BUCKET:nboard}


