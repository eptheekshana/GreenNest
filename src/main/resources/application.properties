# --- DATABASE CONFIGURATION ---
# Uses environment variables for secure configuration
# For production: Set DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD
# For development: Configure in .env file (not committed to git)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/nboard?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}

# H2 Console (disabled by default, enable only for development if using H2)
spring.h2.console.enabled=false

# --- JPA / HIBERNATE ---
spring.jpa.database-platform=${DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- APP SETTINGS ---
server.port=${PORT:8080}

# --- FILE UPLOAD SETTINGS ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# --- FILE STORAGE CONFIGURATION ---
# Mode: auto (uses local if Spaces not configured), local (always local), cloud (always cloud)
file.storage.mode=${FILE_STORAGE_MODE:auto}
# Local upload directory (relative to project root)
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# --- DIGITALOCEAN SPACES CONFIGURATION ---
# Never commit these values! Use .env file or environment variables
do.spaces.key=${DO_SPACES_KEY:}
do.spaces.secret=${DO_SPACES_SECRET:}
do.spaces.endpoint=${DO_SPACES_ENDPOINT:sgp1.digitaloceanspaces.com}
do.spaces.region=${DO_SPACES_REGION:sgp1}
do.spaces.bucket=${DO_SPACES_BUCKET:nboard}


