<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<!-- Form panel -->
<div class="auth-card">

    <div class="auth-header">
        <h1>Welcome back</h1>
        <p>Sign in to your Nboard account.</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger">
        <strong>Error:</strong> Invalid email or password. Please try again.
    </div>

    <form th:action="@{/authenticateTheUser}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="form-group">
            <label for="username">Email Address</label>
            <input type="email" id="username" name="username" class="form-control" required placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-submit">Sign In</button>
    </form>

    <p class="auth-footer">
        Don't have an account? <a href="/register">Sign up</a>
    </p>

</div>

</body>
</html>
