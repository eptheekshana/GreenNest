<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GreenNest</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="login-wrapper">
    <div class="onboarding-card">

        <div class="card-header">
            <h2>Welcome Back! 👋</h2>
            <p class="sub-text">Login to manage your boarding place or find your next home.</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger" role="alert">
            <strong>Access Denied.</strong> Invalid email or password.
        </div>

        <div th:if="${param.logout}" class="alert alert-success" role="alert">
            <strong>Logged Out.</strong> See you soon!
        </div>

        <form th:action="@{/login}" method="post">

            <div class="input-wrapper">
                <label for="username">Email Address</label>
                <input type="email" id="username" name="username"
                       placeholder="name@student.nsbm.ac.lk"
                       autocomplete="username"
                       required autofocus>
            </div>

            <div class="input-wrapper">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Enter your password"
                       autocomplete="current-password"
                       required>
            </div>

            <div class="form-check-group">
                <label class="custom-checkbox" for="remember-me">
                    <input type="checkbox" id="remember-me" name="remember-me">
                    <span class="checkbox-label">Remember me</span>
                </label>
            </div>

            <div class="action-area">
                <button type="submit" class="btn-primary">Sign In</button>
            </div>

            <div class="form-footer">
                <p>New to GreenNest? <a th:href="@{/register}" class="link-highlight">Create an account</a></p>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
