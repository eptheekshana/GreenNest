<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - Nboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/modern-ui.css}">
</head>
<body>

<main class="page" style="padding: 48px 20px;">
    <section class="profile-card" style="max-width: 760px; margin: 0 auto;">
        <div class="card-header" style="margin-bottom: 28px;">
            <div class="avatar" style="width: 84px; height: 84px; font-size: 2rem; background: linear-gradient(135deg, var(--primary), var(--accent));">
                <span th:text="${user != null and user.fullName != null and !#strings.isEmpty(user.fullName) ? #strings.substring(user.fullName, 0, 1) : 'S'}">S</span>
            </div>
            <div>
                <h2 style="margin: 16px 0 6px; font-size: 2rem;" th:text="${user != null and user.fullName != null and !#strings.isEmpty(user.fullName) ? user.fullName : 'Student Profile'}">Student Profile</h2>
                <p class="sub-text" th:text="${user != null and user.role != null ? user.role : 'Your account details and verification status'}">Your account details and verification status</p>
            </div>
        </div>

        <div class="details-grid" style="margin-bottom: 24px;">
            <div class="detail-item">
                <span class="detail-label">Full Name</span>
                <span class="detail-value" th:text="${user != null and user.fullName != null and !#strings.isEmpty(user.fullName) ? user.fullName : 'Not available'}">Not available</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Email</span>
                <span class="detail-value" th:text="${user != null and user.email != null and !#strings.isEmpty(user.email) ? user.email : 'Not available'}">Not available</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Contact Number</span>
                <span class="detail-value" th:text="${user != null and user.contactNumber != null and !#strings.isEmpty(user.contactNumber) ? user.contactNumber : 'Not available'}">Not available</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Role</span>
                <span class="detail-value" th:text="${user != null and user.role != null ? user.role : 'STUDENT'}">STUDENT</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Account Status</span>
                <span class="detail-value" th:text="${user != null and user.isVerified ? 'Verified' : 'Pending verification'}">Pending verification</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Account Type</span>
                <span class="detail-value">Student</span>
            </div>
        </div>

        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
            <a th:href="@{/user/listings}" class="btn-action" style="padding: 12px 22px;">Browse Properties</a>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="btn-page" style="padding: 12px 22px;">Logout</button>
            </form>
        </div>
    </section>
</main>

</body>
</html>
