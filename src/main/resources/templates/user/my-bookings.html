<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Requests - Nboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* ============================
           1. DESIGN SYSTEM VARIABLES
           ============================ */
        :root {
            --primary-green: #27ae60;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --bg-page: #f8fafc;
            --white: #ffffff;
            --border: #e2e8f0;
            --radius-card: 12px;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ============================
           2. LAYOUT WRAPPERS
           ============================ */
        /* Reusing your standard wrapper class */
        .page-wrapper {
            flex: 1; /* Pushes footer to bottom */
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header-section {
            margin-bottom: 40px;
            text-align: left; /* Aligned for better reading flow */
        }

        .header-section h1 { font-size: 2rem; font-weight: 700; color: var(--text-dark); }
        .header-section p { color: var(--text-muted); margin-top: 8px; font-size: 1.05rem; }

        /* ============================
           3. CARD GRID SYSTEM
           ============================ */
        .requests-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .request-card {
            background: var(--white);
            border-radius: var(--radius-card);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.2s ease-in-out;
            position: relative;
        }

        .request-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: #cbd5e1;
        }

        /* Image Handling */
        .card-img-top {
            height: 160px;
            width: 100%;
            background-color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Fallback if no real image is loaded */
        .card-img-placeholder {
            font-size: 3rem;
            opacity: 0.3;
        }

        /* ============================
           4. CARD CONTENT
           ============================ */
        .card-content { padding: 20px; }

        .prop-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .prop-location {
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
        }

        .divider {
            height: 1px;
            background-color: var(--border);
            margin: 15px 0;
        }

        /* ============================
           5. STATUS PILLS (The "Pro" Touch)
           ============================ */
        .status-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            width: 100%;
        }

        /* Dynamic Status Colors */
        .status-PENDING { background-color: #fff7ed; color: #ea580c; border: 1px solid #ffedd5; }
        .status-ACCEPTED { background-color: #f0fdf4; color: #16a34a; border: 1px solid #dcfce7; }
        .status-REJECTED { background-color: #fef2f2; color: #dc2626; border: 1px solid #fee2e2; }

        /* Meta Data */
        .meta-info {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 15px;
            text-align: right;
        }

        /* ============================
           6. EMPTY STATE
           ============================ */
        .empty-state-box {
            text-align: center;
            padding: 80px 20px;
            background: var(--white);
            border-radius: var(--radius-card);
            border: 2px dashed #cbd5e1;
        }

        .btn-action {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;
            background-color: var(--primary-green);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-action:hover { background-color: #219150; }

        /* Mobile Fix */
        @media (max-width: 600px) {
            .requests-grid { grid-template-columns: 1fr; }
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/modern-ui.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="page-wrapper">

    <section class="header-section">
        <h1>My Visit Requests</h1>
        <p>Track the status of your inquiries. If accepted, the owner will contact you.</p>
    </section>

    <div class="requests-grid" th:unless="${#lists.isEmpty(bookings)}">

        <article class="request-card" th:each="booking : ${bookings}">

            <div class="card-img-top">
                <span class="card-img-placeholder">🏡</span>
            </div>

            <div class="card-content">
                <h3 class="prop-title" th:text="${booking.property.title}">Green Villa</h3>

                <div class="prop-location">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span th:text="${booking.property.city}">Pitipana</span>
                </div>

                <div class="status-pill"
                     th:classappend="'status-' + ${booking.status}"
                     th:switch="${booking.status.toString()}">

                    <span th:case="'PENDING'">Waiting for Review</span>
                    <span th:case="'ACCEPTED'">Request Accepted</span>
                    <span th:case="'REJECTED'">Not Available</span>
                </div>

                <div class="meta-info">
                    Sent on <span th:text="${#temporals.format(booking.requestDate, 'MMM dd, yyyy')}">Jan 24, 2026</span>
                </div>
            </div>
        </article>

    </div>

    <div class="empty-state-box" th:if="${#lists.isEmpty(bookings)}">
        <h2 style="font-size: 1.5rem; color: var(--text-dark);">No requests found</h2>
        <p style="color: var(--text-muted); margin-top:10px;">You haven't reached out to any property owners yet.</p>
        <a href="listings.html" class="btn-action">Browse Boarding Places</a>
    </div>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
