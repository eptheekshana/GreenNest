<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Login - Nboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin-login.css}">
</head>
<body>

<div class="login-card">
    <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C7.58 2 4 5.58 4 10v12h16V10c0-4.42-3.58-8-8-8zm0 2c3.31 0 6 2.69 6 6v2H6v-2c0-3.31 2.69-6 6-6zm-1 10h2v4h-2v-4z"/></svg>
        Nboard
    </div>
    <h2>Admin Portal</h2>

    <form th:action="@{/login}" method="post">

        <div th:if="${param.error}" class="alert alert-error">
            Invalid admin credentials. Please try again.
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            You have been logged out securely.
        </div>

        <div class="form-group">
            <label>Admin Email</label>
            <input type="text" name="username" placeholder="admin@greennest.com" required autofocus>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-login">Sign In</button>
    </form>

    <div class="footer-text">
        Protected Area. Authorized Personnel Only.
    </div>
</div>

<script th:src="@{/js/admin-login.js}"></script>
</body>
</html>
