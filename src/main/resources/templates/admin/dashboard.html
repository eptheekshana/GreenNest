<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Nboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
</head>
<body>

<aside class="admin-sidebar">
    <div class="admin-logo">
        <i class="ph-fill ph-shield-check"></i>
        <span>AdminPanel</span>
    </div>
    <nav class="admin-nav">
        <a href="#" class="admin-nav-item active">
            <i class="ph-bold ph-squares-four"></i>
            <span>Dashboard</span>
        </a>
        <a href="#" class="admin-nav-item">
            <i class="ph-bold ph-users"></i>
            <span>All Users</span>
        </a>
        <a href="#" class="admin-nav-item">
            <i class="ph-bold ph-house"></i>
            <span>All Listings</span>
        </a>
    </nav>
    <div class="admin-profile">
        <div class="admin-avatar">A</div>
        <div class="admin-user-info">
            <div class="name">Administrator</div>
            <div class="role">Super User</div>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">
                <i class="ph-bold ph-sign-out"></i>
            </button>
        </form>
    </div>
</aside>

<main class="admin-main-content">
    <header class="admin-header">
        <h1>Dashboard</h1>
        <p class="subtitle">Pending Property Listings</p>
    </header>

    <div th:if="${param.propSuccess}" class="alert-success">
        Property listing approved and is now live!
    </div>

    <div class="table-container">
        <table class="admin-table">
            <thead>
            <tr>
                <th>Image</th>
                <th>Property Title</th>
                <th>Owner</th>
                <th>Price</th>
                <th>Location</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="prop : ${pendingProperties}">
                <td>
                    <img th:src="${prop.primaryPhotoUrl != null ? prop.primaryPhotoUrl : '/images/boarding-room.JPEG'}" class="prop-thumb"
                         onerror="this.src='https.placehold.co/60x40?text=No+Img'" alt="Property Image">
                </td>
                <td th:text="${prop.title}">Title</td>
                <td th:text="${prop.owner.fullName}">Owner Name</td>
                <td th:text="'LKR ' + ${#numbers.formatDecimal(prop.price, 1, 0, 'DEFAULT')}">15000</td>
                <td th:text="${prop.location}">Location</td>
                <td>
                    <form th:action="@{/admin/approve-property/{id}(id=${prop.id})}" method="post">
                        <button type="submit" class="btn-approve">Approve</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${pendingProperties.isEmpty()}">
                <td colspan="6" style="text-align: center; color: #6c757d; padding: 2rem;">No pending property listings.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
