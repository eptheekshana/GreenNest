<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard - GreenNest</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #27ae60;
            --bg-body: #f1f5f9;
            --white: #ffffff;
            --border: #e2e8f0;
            --radius: 12px;
        }
        body { font-family: 'Outfit', sans-serif; background-color: var(--bg-body); margin: 0; padding: 20px; }
        .main-content { max-width: 1100px; margin: auto; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-add { background: var(--primary-green); color: white; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; }
        .table-card { background: var(--white); border-radius: var(--radius); box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px 20px; border-bottom: 1px solid var(--border); text-align: left; }
        th { background: #f8fafc; }
        .btn-red { color: #ef4444; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>

<div class="main-content">
    <div class="section-header">
        <h2>Owner Dashboard</h2>
        <a th:href="@{/property/add}" class="btn-add">+ Add Property</a>
    </div>

    <div class="table-card">
        <table>
            <thead>
            <tr>
                <th>Title</th>
                <th>Price (LKR)</th>
                <th>Location</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="prop : ${properties}">
                <td th:text="${prop.title}"></td>
                <td th:text="${prop.price}"></td>
                <td th:text="${prop.location}"></td>
                <td>
                    <a th:href="@{/property/delete/{id}(id=${prop.id})}" class="btn-red" onclick="return confirm('Are you sure?')">Delete</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(properties)}">
                <td colspan="4" style="text-align: center;">No properties found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
