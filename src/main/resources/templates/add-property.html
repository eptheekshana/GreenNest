<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Your Property - GreenNest</title>

    <style>
        :root {
            --primary-green: #27ae60;
            --primary-hover: #219150;
            --bg-color: #f4f7f6;
            --text-dark: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #e0e0e0;
            --radius: 12px;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* --- Main Card Layout --- */
        .property-form-card {
            background: white;
            width: 100%;
            max-width: 800px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            background-color: var(--primary-green);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .card-header h2 { margin-bottom: 5px; font-size: 1.8rem; }
        .card-header p { opacity: 0.9; font-size: 0.95rem; }

        .card-body {
            padding: 40px;
        }

        /* --- Form Grid --- */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Two Columns */
            gap: 25px;
        }

        .full-width {
            grid-column: span 2;
        }

        /* --- Inputs --- */
        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-dark);
        }

        .input-group input,
        .input-group textarea,
        .input-group select {
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: var(--primary-green);
            box-shadow: 0 0 0 4px rgba(39, 174, 96, 0.1);
        }

        .input-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* --- Custom File Upload Box --- */
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            background-color: #fafafa;
            position: relative;
        }

        .upload-area:hover {
            border-color: var(--primary-green);
            background-color: #f0fcf5;
        }

        .upload-area input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        .upload-icon {
            font-size: 2rem;
            color: var(--primary-green);
            margin-bottom: 10px;
            display: block;
        }

        .upload-text {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* --- Buttons --- */
        .form-actions {
            margin-top: 30px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        .btn-secondary {
            background-color: #ecf0f1;
            color: var(--text-dark);
            text-decoration: none; /* For links */
            display: inline-block;
        }

        .btn-secondary:hover { background-color: #dce4e6; }

        .btn-primary {
            background-color: var(--primary-green);
            color: white;
        }

        .btn-primary:hover { background-color: var(--primary-hover); }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .card-body { padding: 25px; }
        }
    </style>
</head>
<body>

<div class="property-form-card">

    <div class="card-header">
        <h2>🏡 List Your Property</h2>
        <p>Fill in the details below to help students find their new home.</p>
    </div>

    <div class="card-body">

        <form th:action="@{/owner/add}" th:object="${property}" method="post" enctype="multipart/form-data">

            <div class="form-grid">

                <div class="input-group full-width">
                    <label for="title">Property Title</label>
                    <input type="text" id="title" th:field="*{title}"
                           placeholder="e.g. Spacious Room near NSBM" required>
                </div>

                <div class="input-group">
                    <label for="location">Location / City</label>
                    <input type="text" id="location" th:field="*{location}"
                           placeholder="e.g. Pitipana, Homagama" required>
                </div>

                <div class="input-group">
                    <label for="price">Monthly Rent (LKR)</label>
                    <input type="number" id="price" th:field="*{price}"
                           placeholder="e.g. 15000" min="0" step="500" required>
                </div>

                <div class="input-group full-width">
                    <label for="description">Description & Rules</label>
                    <textarea id="description" th:field="*{description}"
                              placeholder="Describe the amenities (AC, WiFi, attached bathroom) and any boarding rules..."></textarea>
                </div>

                <div class="input-group full-width">
                    <label>Property Photo</label>
                    <div class="upload-area">
                        <span class="upload-icon">📷</span>
                        <p class="upload-text">Click or Drag photo here to upload</p>
                        <input type="file" name="image" accept="image/*" required>
                    </div>
                </div>

            </div>

            <div class="form-actions">
                <a href="/" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Publish Listing</button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
