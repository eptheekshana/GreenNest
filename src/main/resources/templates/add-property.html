<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Property</title>
</head>
<body>
<h2>Add New Boarding Place</h2>

<form th:action="@{/owner/add}" th:object="${property}" method="post" enctype="multipart/form-data">

    <label>Title:</label>
    <input type="text" th:field="*{title}" required placeholder="Ex: Luxury Room near NSBM"><br>

    <label>Location:</label>
    <input type="text" th:field="*{location}" required><br>

    <label>Monthly Rent (LKR):</label>
    <input type="number" th:field="*{price}" required><br>

    <label>Description:</label>
    <textarea th:field="*{description}"></textarea><br>

    <label>Photo:</label>
    <input type="file" name="image" required><br>

    <button type="submit">Submit Listing</button>
</form>
</body>
</html>
