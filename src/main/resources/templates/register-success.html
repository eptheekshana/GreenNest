<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Created! - Nboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/modern-ui.css}">
    <link rel="stylesheet" th:href="@{/css/modern-redesign.css}">
    <style>
        .success-box {
            text-align: center;
            max-width: 450px;
            padding: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .icon-box {
            font-size: 4rem;
            margin-bottom: 8px;
        }
        .success-box h1 {
            color: var(--primary);
            margin: 0;
            font-size: 2rem;
        }
        .success-box p {
            color: var(--muted);
            margin: 0 0 24px 0;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<main class="auth-shell">
    <div class="success-card success-box">
        <div class="icon-box">🎉</div>
        <h1>Account Created!</h1>
        <p>Welcome to Nboard. Your account has been successfully registered. You can now log in to start exploring verified boarding places.</p>

        <a th:href="@{/login}" class="btn-primary">Go to Login</a>
    </div>
</main>

</body>
</html>
