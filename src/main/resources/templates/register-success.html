<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful - Nboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/modern-ui.css}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
<div class="auth-card text-center" data-reveal>
    <div style="font-size: 4rem; color: var(--primary); line-height: 1; margin-bottom: 1.5rem;">
        <i class="ph-fill ph-check-circle"></i>
    </div>
    <h1>Registration Successful!</h1>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">Your account has been created. You can now log in to continue.</p>
    <a href="/login" class="btn btn-primary" style="text-decoration: none; display: block;">Go to Login</a>
</div>
<script th:src="@{/js/app.js}"></script>

</html>
