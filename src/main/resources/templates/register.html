<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join GreenNest - Create Account</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="registration-wrapper">
    <div class="onboarding-card">

        <div class="card-header">
            <h2>Welcome to GreenNest! 🌱</h2>
            <p class="sub-text">Let's get you set up so you can start your journey.</p>
        </div>

        <form class="signup-form" th:action="@{/register}" th:object="${user}" method="post">

            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                <p>Please correct the errors below.</p>
            </div>

            <fieldset class="role-selection-group">
                <legend class="section-label">First, tell us what brings you here:</legend>

                <div class="role-grid">
                    <label class="role-card" for="roleStudent">
                        <input type="radio" id="roleStudent" th:field="*{role}" value="STUDENT" checked>
                        <span class="role-details">
                                <span class="role-title">I'm a Student</span>
                                <span class="role-desc">I'm looking for a boarding place near NSBM.</span>
                            </span>
                    </label>

                    <label class="role-card" for="roleOwner">
                        <input type="radio" id="roleOwner" th:field="*{role}" value="OWNER">
                        <span class="role-details">
                                <span class="role-title">I'm a Property Owner</span>
                                <span class="role-desc">I want to list my boarding place.</span>
                            </span>
                    </label>
                </div>
            </fieldset>

            <div class="row-group">
                <div class="input-wrapper">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" th:field="*{firstName}"
                           placeholder="e.g. Sadewma"
                           th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'" required>
                    <span class="error-msg" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
                </div>

                <div class="input-wrapper">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" th:field="*{lastName}"
                           placeholder="e.g. Perera"
                           th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'" required>
                    <span class="error-msg" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
                </div>
            </div>

            <div class="input-wrapper">
                <label for="email">Email Address</label>
                <input type="email" id="email" th:field="*{email}"
                       placeholder="name@student.nsbm.ac.lk"
                       aria-describedby="emailHint" required>
                <span id="emailHint" class="hint-text">If you are a student, using your uni email helps us verify you faster.</span>
                <span class="error-msg" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>

            <div class="input-wrapper">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}"
                       placeholder="Create a strong password" required>
                <span class="error-msg" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>

            <div class="action-area">
                <button type="submit" class="btn btn-primary btn-block">Create My Account</button>
            </div>

            <div class="form-footer">
                <p>Already have an account? <a th:href="@{/login}" class="link-highlight">Log in here</a></p>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
