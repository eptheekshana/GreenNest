<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account - Nboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/modern-ui.css}">
</head>
<body>
<div class="auth-card">
    <h1>Create Your Account</h1>
    <form th:action="@{/register}" th:object="${user}" method="post">
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" th:field="*{fullName}" class="form-control" required placeholder="John Doe">
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" th:field="*{email}" class="form-control" required placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}" class="form-control" required placeholder="••••••••">
        </div>
        <div class="form-group">
            <label for="role">I am a...</label>
            <select id="role" th:field="*{role}" class="form-control" required>
                <option value="" disabled selected>Select your role</option>
                <option value="STUDENT">Student looking for a room</option>
                <option value="OWNER">Property Owner</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
    </form>
    <p style="text-align: center; margin-top: 2rem; color: var(--text-muted);">
        Already have an account? <a href="/login" style="color: var(--primary); text-decoration: none; font-weight: 600;">Log In</a>
    </p>
</div>
</body>
</html>
