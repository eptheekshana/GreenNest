<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Nboard - Create Account</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>

<div class="onboarding-card">
    <div class="card-header">
        <h2>Nboard</h2>
        <p class="sub-text">Create your account to get started</p>
    </div>

    <form th:action="@{/register}" th:object="${user}" method="post">

        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <div class="input-wrapper">
            <label for="role">I am a:</label>
            <select id="role" th:field="*{role}"
                    th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'"
                    required>
                <option value="">-- Select your role --</option>
                <option value="STUDENT">Student (Looking for a place)</option>
                <option value="OWNER">Property Owner (Listing a place)</option>
            </select>
            <span class="error-msg" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></span>
        </div>

        <div class="input-wrapper">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" th:field="*{fullName}"
                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                   placeholder="e.g. Sadewma Marasinghe"
                   maxlength="255" required>
            <span class="error-msg" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
        </div>

        <div class="input-wrapper">
            <label for="email">Email Address</label>
            <input type="email" id="email" th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                   placeholder="sadew@gmail.com"
                   maxlength="255" required>
            <span class="error-msg" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="input-wrapper">
            <label for="contactNumber">Contact Number</label>
            <input type="tel" id="contactNumber" th:field="*{contactNumber}"
                   th:classappend="${#fields.hasErrors('contactNumber')} ? 'is-invalid'"
                   placeholder="07x xxxxxxx"
                   pattern="[0-9]{10}"
                   title="Please enter a valid 10-digit mobile number" required>
            <span class="error-msg" th:if="${#fields.hasErrors('contactNumber')}" th:errors="*{contactNumber}"></span>
        </div>

        <div class="input-wrapper">
            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}"
                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                   placeholder="Min 8 characters" minlength="8" required>
            <span class="error-msg" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>

            <!-- Password Requirements Display -->
            <div class="password-requirements">
                <p class="requirements-title">Password must contain:</p>
                <ul class="requirements-list">
                    <li id="req-length" class="requirement">
                        <span class="requirement-icon">✓</span>
                        <span>At least 8 characters</span>
                    </li>
                    <li id="req-upper" class="requirement">
                        <span class="requirement-icon">✓</span>
                        <span>At least one uppercase letter (A-Z)</span>
                    </li>
                    <li id="req-lower" class="requirement">
                        <span class="requirement-icon">✓</span>
                        <span>At least one lowercase letter (a-z)</span>
                    </li>
                    <li id="req-number" class="requirement">
                        <span class="requirement-icon">✓</span>
                        <span>At least one number (0-9)</span>
                    </li>
                    <li id="req-special" class="requirement">
                        <span class="requirement-icon">✓</span>
                        <span>At least one special character (!@#$%^&*)</span>
                    </li>
                </ul>
            </div>
        </div>

        <div class="input-wrapper">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                   placeholder="Re-enter your password" minlength="8" required>
            <span class="error-msg" id="confirmPasswordError" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
        </div>

        <button type="submit" class="btn-primary">Create Account</button>

        <div class="form-footer">
            <p>Already have an account? <a th:href="@{/login}" class="link-highlight">Log in</a></p>
        </div>
    </form>
</div>

<script th:src="@{/js/register.js}"></script>
</body>
</html>
