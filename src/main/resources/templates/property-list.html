<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Boarding Place - GreenNest</title>

    <style>
        :root {
            --primary-green: #27ae60;
            --bg-color: #f4f7f6;
            --text-dark: #2c3e50;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.05);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
        }

        /* --- Header / Nav --- */
        .navbar {
            background: white;
            padding: 15px 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand { font-size: 1.5rem; font-weight: bold; color: var(--primary-green); text-decoration: none; }
        .nav-links a { margin-left: 20px; text-decoration: none; color: var(--text-dark); font-weight: 500; }
        .btn-add { background: var(--primary-green); color: white !important; padding: 8px 16px; border-radius: 6px; }

        /* --- Main Container --- */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 { text-align: center; margin-bottom: 40px; }

        /* --- Success Message (Visible after upload) --- */
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #c3e6cb;
        }

        /* --- The Grid Layout --- */
        .property-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        /* --- Property Card --- */
        .property-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }

        .property-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* Image Handling */
        .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover; /* Ensures image covers area without stretching */
            background-color: #eee;
        }

        .card-body {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .price-tag {
            color: var(--primary-green);
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .card-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .location-tag {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-view {
            margin-top: auto;
            display: block;
            text-align: center;
            background-color: var(--text-dark);
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn-view:hover { background-color: #34495e; }

        /* Empty State */
        .no-data {
            text-align: center;
            grid-column: 1 / -1;
            padding: 50px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/" class="brand">Nboard 🌱</a>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="owner/add-property.html" class="btn-add">+ List Property</a>
    </div>
</nav>

<div class="container">

    <div th:if="${param.success}" class="alert-success">
        ✅ Property listed successfully! It is now live.
    </div>

    <h1>Available Boarding Places</h1>

    <div class="property-grid">

        <div th:each="property : ${properties}" class="property-card">

            <img th:src="${property.imageUrl}" alt="Property Image" class="card-img">

            <div class="card-body">
                <div class="price-tag" th:text="'LKR ' + ${property.price} + '/mo'">LKR 15,000/mo</div>
                <h3 class="card-title" th:text="${property.title}">Luxury Room</h3>

                <div class="location-tag">
                    📍 <span th:text="${property.location}">Homagama</span>
                </div>

                <p style="color: #666; font-size: 0.9rem; margin-bottom: 15px;"
                   th:text="${#strings.abbreviate(property.description, 80)}">
                    Description...
                </p>

                <a href="#" class="btn-view">View Details</a>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(properties)}" class="no-data">
            <h3>No boarding places found yet. </h3>
            <p>Be the first to list one!</p>
            <a href="/owner/add-property" class="btn-add" style="display:inline-block; margin-top:10px;">List Property</a>
        </div>

    </div>
</div>

</body>
</html>
