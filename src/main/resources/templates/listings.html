<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Listings - Nboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/modern-ui.css}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
<nav class="top-nav">
    <div class="container">
        <a href="/" class="brand">Nboard</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/properties" class="active">Listings</a>
            <div sec:authorize="!isAuthenticated()" class="nav-auth-buttons">
                <a href="/login">Login</a>
                <a href="/register" class="nav-button">Register</a>
            </div>
            <div sec:authorize="isAuthenticated()" class="nav-auth-buttons">
                <a href="/owner/dashboard">Dashboard</a>
                <a href="/logout" class="nav-button">Logout</a>
            </div>
        </div>
    </div>
</nav>

<main class="container" data-reveal>
    <div style="text-align: center; margin: 4rem 0;">
        <h1 style="font-size: 3rem; font-weight: 800; letter-spacing: -0.04em;">All Available Properties</h1>
        <p style="color: var(--text-muted); font-size: 1.1rem;">Browse through all verified listings</p>
    </div>
    <div class="property-grid" th:if="${not #lists.isEmpty(properties)}">
        <div class="property-card" th:each="property, iterStat : ${properties}" data-reveal th:style="'transition-delay: ' + ${iterStat.index * 100} + 'ms'">
            <div class="property-image-wrapper">
                <img th:src="${property.primaryPhotoUrl != null ? property.primaryPhotoUrl : '/images/boarding-room.JPEG'}"
                     alt="Property image" class="property-image">
            </div>
            <div class="property-body">
                <h3 th:text="${property.title}">Property Title</h3>
                <p class="property-location" th:text="${property.location}">Location</p>
                <div class="property-footer">
                    <strong th:text="'LKR ' + ${#numbers.formatDecimal(property.price, 1, 0, 'DEFAULT')} + ' / month'">LKR 0 / month</strong>
                    <a th:href="@{/property-details/{id}(id=${property.id})}">View Details <i class="ph-bold ph-arrow-right"></i></a>
                </div>
            </div>
        </div>
    </div>
    <div th:if="${#lists.isEmpty(properties)}" class="card" style="text-align: center; padding: 4rem; color: var(--text-muted);" data-reveal>
        <p style="font-size: 1.1rem;">No properties available at the moment. Please check back soon!</p>
    </div>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
