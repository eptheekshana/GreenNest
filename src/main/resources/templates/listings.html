<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listings - Nboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme-simple.css}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .listings-header {
            padding: 4rem 0 3rem;
            border-bottom: 1px solid var(--border);
            background: var(--white);
        }

        .listings-header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.2rem;
            color: var(--ink);
            margin-bottom: 1rem;
        }

        .listings-header p {
            color: var(--ink-faint);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .search-form {
            display: flex;
            gap: 1rem;
            max-width: 600px;
        }

        .search-form input {
            flex: 1;
            padding: 0.9rem 1.2rem;
            border: 1px solid var(--border-mid);
            border-radius: 2px;
            font-family: inherit;
            font-size: 0.95rem;
            background: var(--bg);
            transition: all 0.2s;
        }

        .search-form input:focus {
            outline: none;
            border-color: var(--green);
            background: var(--white);
            box-shadow: 0 0 0 3px var(--green-pale);
        }
        
        .listings-grid-container {
            padding: 4rem 0 6rem;
        }

        @media (max-width: 640px) {
            .search-form {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<nav class="top-nav">
    <div class="container">
        <a href="/" class="brand">Nboard</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/properties" class="active">Listings</a>
            <div sec:authorize="!isAuthenticated()" class="nav-auth-buttons">
                <a href="/login">Login</a>
                <a href="/register" class="nav-button">Register</a>
            </div>
            <div sec:authorize="isAuthenticated()" class="nav-auth-buttons">
                <a href="/owner/dashboard">Dashboard</a>
                <a href="/logout" class="nav-button">Logout</a>
            </div>
        </div>
    </div>
</nav>

<main>
    <section class="listings-header">
        <div class="container">
            <h1>Find Your Perfect Stay</h1>
            <p>Browse verified boarding places near NSBM Green University.</p>
            
            <form action="/search" method="get" class="search-form">
                <input type="text" name="location" placeholder="Location (e.g. Homagama)" th:value="${location}">
                <input type="number" step="1" min="0" name="price" placeholder="Max Price (LKR)" th:value="${price}">
                <button type="submit" class="btn btn-primary">
                    <i class="ph-bold ph-magnifying-glass"></i> Search
                </button>
            </form>
        </div>
    </section>

    <section class="container listings-grid-container" data-reveal>
        <div class="property-grid" th:if="${not #lists.isEmpty(properties)}">
            <div class="property-card"
                 th:each="property, iterStat : ${properties}"
                 th:style="'animation-delay: ' + ${iterStat.index * 80} + 'ms'">
                <div class="property-image-wrapper">
                    <img th:src="${property.primaryPhotoUrl != null ? property.primaryPhotoUrl : '/images/boarding-room.JPEG'}"
                         alt="Property image" class="property-image">
                </div>
                <div class="property-body">
                    <h3 th:text="${property.title}">Property Title</h3>
                    <p class="property-location" th:text="${property.location}">Location</p>
                    <div class="property-footer">
                        <strong th:text="'LKR ' + ${#numbers.formatDecimal(property.price, 1, 0, 'DEFAULT')} + ' / mo'">LKR 0 / mo</strong>
                        <a th:href="@{/property-details/{id}(id=${property.id})}">
                            View Details <i class="ph-bold ph-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(properties)}" class="empty-state">
            <i class="ph-bold ph-house-simple"></i>
            <p>No properties found. Try adjusting your search filters.</p>
        </div>
    </section>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
