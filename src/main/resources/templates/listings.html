<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Boarding Place - GreenNest</title>
    <style>
        :root {
            --primary-green: #27ae60;
            --bg-color: #f4f7f6;
            --text-dark: #2c3e50;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.05);
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-dark); margin: 0; padding: 0; }
        .navbar { background: white; padding: 15px 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 1.5rem; font-weight: bold; color: var(--primary-green); text-decoration: none; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .search-bar { background: white; padding: 25px; border-radius: 15px; box-shadow: var(--card-shadow); display: flex; gap: 15px; margin-bottom: 40px; align-items: flex-end; }
        .search-bar .input-group { display: flex; flex-direction: column; flex: 1; }
        .search-bar label { font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: #7f8c8d; }
        .search-bar input { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        .btn-search { background: var(--primary-green); color: white; border: none; padding: 12px 30px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .property-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        .property-card { background: white; border-radius: 15px; overflow: hidden; box-shadow: var(--card-shadow); transition: 0.3s; }
        .property-card:hover { transform: translateY(-5px); }
        .card-img { width: 100%; height: 220px; object-fit: cover; }
        .card-body { padding: 20px; }
        .price-tag { color: var(--primary-green); font-size: 1.25rem; font-weight: bold; margin-bottom: 10px; }
        .btn-view { display: block; background: #2c3e50; color: white; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; margin-top: 15px; font-weight: 600; }
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 40px; }
        .pagination a { padding: 10px 15px; border: 1px solid #ddd; text-decoration: none; color: var(--text-dark); border-radius: 5px; }
        .active-page { background: var(--primary-green); color: white !important; border-color: var(--primary-green) !important; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/" class="brand">GreenNest 🌱</a>
    <div class="nav-links">
        <a href="/owner/dashboard" style="text-decoration: none; color: var(--text-dark); font-weight: 500;">My Dashboard</a>
    </div>
</nav>

<div class="container">
    <form th:action="@{/search}" method="get" class="search-bar">
        <div class="input-group">
            <label>Location</label>
            <input type="text" name="location" th:value="${location}" placeholder="e.g. Pitipana">
        </div>
        <div class="input-group">
            <label>Max Price (LKR)</label>
            <input type="number" name="price" th:value="${price}" placeholder="e.g. 20000">
        </div>
        <button type="submit" class="btn-search">Search Now</button>
    </form>

    <div class="property-grid">
        <div th:each="property : ${properties}" class="property-card">
            <img th:src="@{'/uploads/' + ${property.imageName}}" class="card-img" onerror="this.src='https://via.placeholder.com/350x220'">
            <div class="card-body">
                <div class="price-tag" th:text="'LKR ' + ${property.price} + ' / mo'"></div>
                <h3 th:text="${property.title}"></h3>
                <p style="color: #7f8c8d;">📍 <span th:text="${property.location}"></span></p>
                <a th:href="@{'/property/' + ${property.id}}" class="btn-view">View Details</a>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(properties)}" style="text-align: center; padding: 50px;">
        <h3>No results found for your search.</h3>
        <a href="/search" style="color: var(--primary-green);">Clear filters</a>
    </div>

    <div th:if="${totalPages > 1}" class="pagination">
        <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
           th:href="@{/search(location=${location}, price=${price}, page=${i})}"
           th:text="${i + 1}"
           th:classappend="${currentPage == i} ? 'active-page'"></a>
    </div>
</div>

</body>
</html>
