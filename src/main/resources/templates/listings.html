<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Boarding Place - GreenNest</title>
    <style>
        :root {
            --primary-green: #27ae60;
            --bg-color: #f4f7f6;
            --text-dark: #2c3e50;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.05);
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-dark); margin: 0; padding: 0; }
        .navbar { background: white; padding: 15px 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 1.5rem; font-weight: bold; color: var(--primary-green); text-decoration: none; }
        .nav-links a { margin-left: 20px; text-decoration: none; color: var(--text-dark); font-weight: 500; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .search-container { background: white; padding: 25px; border-radius: 12px; box-shadow: var(--card-shadow); margin-bottom: 40px; }
        .search-form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 15px; }
        .search-form input { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        .btn-search { background: var(--primary-green); color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .property-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
        .property-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: var(--card-shadow); transition: transform 0.2s; display: flex; flex-direction: column; }
        .property-card:hover { transform: translateY(-5px); }
        .card-img { width: 100%; height: 200px; object-fit: cover; background-color: #eee; }
        .card-body { padding: 20px; flex: 1; display: flex; flex-direction: column; }
        .price-tag { color: var(--primary-green); font-weight: 700; font-size: 1.2rem; margin-bottom: 5px; }
        .location-tag { color: #7f8c8d; font-size: 0.9rem; margin-bottom: 15px; }
        .btn-view { margin-top: auto; display: block; text-align: center; background-color: var(--text-dark); color: white; padding: 10px; border-radius: 8px; text-decoration: none; }
        .pagination-container { display: flex; justify-content: center; gap: 10px; margin: 40px 0; }
        .no-data { text-align: center; grid-column: 1 / -1; padding: 50px; color: #7f8c8d; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/" class="brand">GreenNest 🌱</a>
    <div class="nav-links">
        <a href="/">Home</a>
        <a th:href="@{/search}">Explore</a>
    </div>
</nav>

<div class="container">
    <div class="search-container">
        <form th:action="@{/search}" method="get" class="search-form">
            <input type="text" name="location" placeholder="City (e.g. Pitipana)" th:value="${location}">
            <input type="number" name="price" placeholder="Max Price (LKR)" th:value="${price}">
            <button type="submit" class="btn-search">Find Now</button>
        </form>
    </div>

    <h1>Available Boarding Places</h1>

    <div class="property-grid">
        <div th:each="property : ${properties}" class="property-card">
            <img th:src="@{'/uploads/' + ${property.imageName}}" alt="Property Image" class="card-img" onerror="this.src='https://via.placeholder.com/300x200'">
            <div class="card-body">
                <div class="price-tag" th:text="'LKR ' + ${property.price} + '/mo'"></div>
                <h3 th:text="${property.title}"></h3>
                <div class="location-tag">📍 <span th:text="${property.location}"></span></div>
                <a href="#" class="btn-view">View Details</a>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(properties)}" class="no-data">
            <h3>No boarding places found.</h3>
            <p>Try changing your search filters.</p>
        </div>
    </div>

    <div th:if="${totalPages > 1}" class="pagination-container">
        <a th:if="${currentPage > 0}"
           th:href="@{/search(location=${location}, price=${price}, page=${currentPage - 1})}"
           class="btn-view" style="padding: 10px 20px; background-color: var(--primary-green);">Previous</a>

        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
            <a th:href="@{/search(location=${location}, price=${price}, page=${i})}"
               th:text="${i + 1}"
               th:style="${currentPage == i} ? 'background: var(--primary-green); color: white; padding: 10px 15px; border-radius: 8px; text-decoration: none;' : 'background: white; color: var(--text-dark); padding: 10px 15px; border-radius: 8px; text-decoration: none; border: 1px solid #ddd;'"></a>
        </span>

        <a th:if="${currentPage < totalPages - 1}"
           th:href="@{/search(location=${location}, price=${price}, page=${currentPage + 1})}"
           class="btn-view" style="padding: 10px 20px; background-color: var(--primary-green);">Next</a>
    </div>
</div>

</body>
</html>
