<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Owner Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .profile-img {
            text-align: center;
        }
        .profile-img img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }
        .info {
            margin-top: 20px;
        }
        .info p {
            margin: 8px 0;
            font-size: 16px;
        }
        .label {
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Owner Profile</h2>

    <div class="profile-img">
        <img src=""alt="Student photo">
        <div class="info">

            <p><span class="label">Full Name:</span> </p>
            <p><span class="label"> ID:</span> </p>
            <p><span class="label">Email:</span> </p>
            <p><span class="label">Phone:</span> </p>
            <p><span class="label">Address:</span> </p>
        </div>
    </div>

</body>
</html>
