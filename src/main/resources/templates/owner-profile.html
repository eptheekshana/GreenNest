<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Profile - Nboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/modern-ui.css}">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:          #F0F5F1;
            --bg-dark:     #DFF0E3;
            --ink:         #0D1F14;
            --ink-muted:   #2D4A36;
            --ink-faint:   #5A7A63;
            --green:       #2E7D4F;
            --green-light: #4CAF72;
            --green-pale:  #E8F5EC;
            --white:       #F7FDF9;
            --border:      rgba(13,31,20,0.11);
            --border-mid:  rgba(13,31,20,0.18);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
        }

        /* ── NAV ── */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(240,245,241,0.88);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }

        .nav-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 2rem;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-family: 'Syne', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--ink);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav-links a {
            font-size: 0.82rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-links a:hover { color: var(--green); }

        /* ── PAGE ── */
        .page {
            max-width: 860px;
            margin: 0 auto;
            padding: 4rem 2rem 6rem;
        }

        /* ── PAGE HEADER ── */
        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 3rem;
            opacity: 0;
            transform: translateY(16px);
            animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
        }

        .page-eyebrow {
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--green);
            margin-bottom: 0.5rem;
        }

        .page-header h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.6rem, 3vw, 2.2rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--ink);
        }

        /* ── PROFILE HERO ── */
        .profile-hero {
            display: flex;
            align-items: center;
            gap: 1.8rem;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 1.5px;
            opacity: 0;
            transform: translateY(16px);
            animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--bg-dark);
            border: 2px solid rgba(46,125,79,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syne', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--green);
            flex-shrink: 0;
        }

        .profile-meta h2 {
            font-family: 'Syne', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--ink);
            margin-bottom: 0.3rem;
        }

        .profile-role {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--green);
            background: var(--green-pale);
            border: 1px solid rgba(46,125,79,0.2);
            padding: 0.25rem 0.7rem;
            border-radius: 2px;
        }

        /* ── DETAILS GRID ── */
        .details-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 8px 8px;
            overflow: hidden;
            opacity: 0;
            transform: translateY(16px);
            animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.18s forwards;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .detail-item {
            padding: 1.2rem 1.6rem;
            border-bottom: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }

        .detail-item:nth-child(even) { border-right: none; }
        .detail-item:nth-last-child(-n+2) { border-bottom: none; }

        .detail-label {
            display: block;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--ink-faint);
            margin-bottom: 0.35rem;
        }

        .detail-value {
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--ink);
        }

        .badge-verified {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--green);
        }

        .badge-verified::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
        }

        .badge-pending {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--ink-faint);
        }

        .badge-pending::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--ink-faint);
        }

        /* ── ACTIONS ── */
        .actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-top: 2rem;
            opacity: 0;
            transform: translateY(16px);
            animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.26s forwards;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-primary {
            background: var(--green);
            color: var(--white);
        }

        .btn-primary:hover { background: var(--ink); }

        .btn-outline {
            background: transparent;
            color: var(--ink-muted);
            border: 1px solid var(--border-mid);
        }

        .btn-outline:hover {
            border-color: var(--ink);
            color: var(--ink);
        }

        /* ── ANIMATION ── */
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 600px) {
            .details-grid { grid-template-columns: 1fr; }
            .detail-item { border-right: none; }
            .detail-item:nth-last-child(-n+2) { border-bottom: 1px solid var(--border); }
            .detail-item:last-child { border-bottom: none; }
            .profile-hero { flex-direction: column; align-items: flex-start; gap: 1rem; }
            .page-header { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
        }
    </style>
</head>
<body>

<nav class="top-nav">
    <div class="nav-inner">
        <a href="/" class="brand">Nboard</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/properties">Listings</a>
            <a href="/owner/dashboard">Dashboard</a>
        </div>
    </div>
</nav>

<main class="page">

    <div class="page-header">
        <div>
            <p class="page-eyebrow">Account</p>
            <h1>Owner Profile</h1>
        </div>
    </div>

    <!-- Profile hero row -->
    <div class="profile-hero">
        <div class="avatar"
             th:text="${user != null and user.fullName != null and !#strings.isEmpty(user.fullName) ? #strings.substring(user.fullName, 0, 1) : 'O'}">O</div>
        <div class="profile-meta">
            <h2 th:text="${user != null and user.fullName != null and !#strings.isEmpty(user.fullName) ? user.fullName : 'Owner Profile'}">Owner Profile</h2>
            <span class="profile-role"
                  th:text="${user != null and user.role != null ? user.role : 'OWNER'}">OWNER</span>
        </div>
    </div>

    <!-- Details grid -->
    <div class="details-card">
        <div class="details-grid">

            <div class="detail-item">
                <span class="detail-label">Full Name</span>
                <span class="detail-value"
                      th:text="${user != null and user.fullName != null and !#strings.isEmpty(user.fullName) ? user.fullName : 'Not available'}">Not available</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Email</span>
                <span class="detail-value"
                      th:text="${user != null and user.email != null and !#strings.isEmpty(user.email) ? user.email : 'Not available'}">Not available</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Contact Number</span>
                <span class="detail-value"
                      th:text="${user != null and user.contactNumber != null and !#strings.isEmpty(user.contactNumber) ? user.contactNumber : 'Not available'}">Not available</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Account Type</span>
                <span class="detail-value">Property Owner</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Role</span>
                <span class="detail-value"
                      th:text="${user != null and user.role != null ? user.role : 'OWNER'}">OWNER</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Account Status</span>
                <span th:if="${user != null and user.isVerified}" class="badge-verified">Verified</span>
                <span th:unless="${user != null and user.isVerified}" class="badge-pending">Pending verification</span>
            </div>

        </div>
    </div>

    <!-- Actions -->
    <div class="actions">
        <a th:href="@{/owner/dashboard}" class="btn btn-primary">Go to Dashboard</a>
        <form th:action="@{/logout}" method="post" style="margin: 0;">
            <button type="submit" class="btn btn-outline">Logout</button>
        </form>
    </div>

</main>
</body>
</html>
