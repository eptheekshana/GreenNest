<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking UI</title>

    <style>
        body {
          font-family: Arial, sans-serif;
          background: #f5f5f5;
          display: flex;
          justify-content: center;
          margin-top: 40px;
        }

        .property-card {
          width: 320px;
          background: #fff;
          border-radius: 10px;
          padding: 15px;
          box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .property-img {
          width: 100%;
          border-radius: 8px;
        }

        h2 {
          margin: 10px 0 5px;
        }

        .price {
          color: green;
          font-weight: bold;
          margin-bottom: 5px;
        }

        .desc {
          font-size: 14px;
          color: #555;
          margin-bottom: 15px;
        }

        .book-btn {
          width: 100%;
          padding: 10px;
          background: #2563eb;
          color: white;
          border: none;
          border-radius: 6px;
          cursor: pointer;
          font-size: 15px;
        }

        .book-btn:hover {
          background: #1e40af;
        }
    </style>
</head>
<body>

<div class="property-card">
    <img src=  alt="Room Image" class="property-img">

    <h2>Single Room for Rent</h2>
    <p class="price">LKR 15,000 / month</p>
    <p class="desc">
        Fully furnished room near university. Water & WiFi included.
    </p>

    <button id="bookBtn" class="book-btn">Book Now</button>
</div>

<script>

    const userRole = "student";

    const bookBtn = document.getElementById("bookBtn");

    if (userRole !== "student") {
      bookBtn.style.display = "none";
    }
</script>

</body>
</html>
