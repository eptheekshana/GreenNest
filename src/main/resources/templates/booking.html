<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking UI - Nboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/modern-ui.css">
    <link rel="stylesheet" href="/css/modern-redesign.css">
    <style>
        .booking-card {
            max-width: 380px;
            width: 100%;
        }
    </style>
</head>
<body>

<main class="auth-shell">
    <div class="card booking-card property-card">
        <img src="/images/boarding-room.JPEG" alt="Room Image" class="property-image" onerror="this.src='https://placehold.co/600x400/f1f5f9/94a3b8?text=No+Image'">

        <div class="property-content">
            <h2 class="property-title">Single Room for Rent</h2>
            <p class="property-price">LKR 15,000 <span style="font-size: 0.8em; color: var(--muted); font-weight: 500;">/ month</span></p>
            <p class="description-text" style="margin-top: 4px;">
                Fully furnished room near university. Water & WiFi included.
            </p>

            <button id="bookBtn" class="btn-primary" style="margin-top: 14px; width: 100%;">Book Now</button>
        </div>
    </div>
</main>

<script>
    const userRole = "student";
    const bookBtn = document.getElementById("bookBtn");
    if (userRole !== "student") {
      bookBtn.style.display = "none";
    }
</script>

</body>
</html>
