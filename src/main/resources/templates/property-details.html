<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${property.title} + ' - Nboard'">Property Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/home-simplified.css}">
    <link rel="stylesheet" th:href="@{/css/property-details.css}">
</head>
<body>
<div class="container">
    <nav class="top-nav">
        <a href="/" class="brand">Nboard</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/properties">Listings</a>
            <div sec:authorize="!isAuthenticated()">
                <a href="/login">Login</a>
                <a href="/register" class="nav-button">Register</a>
            </div>
            <div sec:authorize="isAuthenticated()">
                <a href="/logout" class="nav-button">Logout</a>
            </div>
        </div>
    </nav>

    <div class="property-header">
        <h1 th:text="${property.title}">Property Title</h1>
        <p class="property-location" th:text="${property.location}">Location</p>
    </div>

    <img th:src="${property.primaryPhotoUrl != null ? property.primaryPhotoUrl : '/images/boarding-room.JPEG'}"
         alt="Property image" class="property-image">

    <div class="property-details">
        <h2>About this property</h2>
        <p th:text="${property.description}">Description of the property.</p>

        <div class="property-price" th:text="'LKR ' + ${#numbers.formatDecimal(property.price, 1, 0, 'DEFAULT')}">LKR 0</div>

        <a href="#" class="btn-primary">Contact Owner</a>
    </div>
</div>
</body>
</html>
