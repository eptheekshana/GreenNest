<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Property Details - GreenNest</title>
    <style>
        :root { --primary: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); margin: 0; padding: 0; }
        .container { max-width: 1000px; margin: 40px auto; padding: 20px; display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .main-img { width: 100%; height: 400px; object-fit: cover; border-radius: 10px; }
        .price { font-size: 26px; color: var(--primary); font-weight: bold; margin: 15px 0; }
        .btn-contact { display: block; background: var(--primary); color: white; text-align: center; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<div style="padding: 20px;"><a href="/search" style="color: var(--primary); text-decoration: none; font-weight: bold;">← Back to Search</a></div>
<div class="container">
    <div class="card">
        <img th:src="@{'/uploads/' + ${property.imageName}}" class="main-img" onerror="this.src='https://via.placeholder.com/800x400'">
        <div class="price" th:text="'LKR ' + ${property.price} + ' / mo'"></div>
        <h1 th:text="${property.title}"></h1>
        <p>📍 <span th:text="${property.location}"></span></p>
        <hr>
        <h3>Description</h3>
        <p th:text="${property.description}"></p>
    </div>
    <div class="card">
        <h3>Owner Details</h3>
        <p><strong>Name:</strong> <span th:text="${property.owner.fullName}"></span></p>
        <p><strong>Email:</strong> <span th:text="${property.owner.email}"></span></p>
        <a th:href="'mailto:' + ${property.owner.email}" class="btn-contact">Contact Owner</a>
    </div>
</div>
</body>
</html>
