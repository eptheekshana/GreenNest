<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${property.title} + ' - Nboard'">Property Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/modern-ui.css}">
    <link rel="stylesheet" th:href="@{/css/property-details.css}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
<nav class="top-nav">
    <div class="container">
        <a href="/" class="brand">Nboard</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/properties">Listings</a>
            <div sec:authorize="!isAuthenticated()" class="nav-auth-buttons">
                <a href="/login">Login</a>
                <a href="/register" class="nav-button">Register</a>
            </div>
            <div sec:authorize="isAuthenticated()" class="nav-auth-buttons">
                <a href="/owner/dashboard">Dashboard</a>
                <a href="/logout" class="nav-button">Logout</a>
            </div>
        </div>
    </div>
</nav>

<main class="container" data-reveal>
    <header class="details-header">
        <h1 th:text="${property.title}">Property Title</h1>
        <p class="location"><i class="ph-bold ph-map-pin"></i> <span th:text="${property.location}">Location</span></p>
    </header>

    <div class="photo-gallery" data-reveal>
        <img th:src="${property.primaryPhotoUrl != null ? property.primaryPhotoUrl : '/images/boarding-room.JPEG'}" alt="Main property view" class="main-photo">
        <div class="thumbnail-grid">
            <img src="https://placehold.co/600x400/e2e8f0/334155?text=Room" alt="Thumbnail 1" class="thumbnail">
            <img src="https://placehold.co/600x400/e2e8f0/334155?text=Bathroom" alt="Thumbnail 2" class="thumbnail">
        </div>
    </div>

    <div class="details-body">
        <div class="property-description" data-reveal>
            <h2>About this property</h2>
            <p th:text="${property.description}">Description of the property.</p>
        </div>
        <aside class="booking-card" data-reveal>
            <div class="price" th:text="'LKR ' + ${#numbers.formatDecimal(property.price, 1, 0, 'DEFAULT')}">LKR 0</div>
            <div class="price-period">per month</div>
            <a href="#" class="btn btn-primary"><i class="ph-bold ph-phone"></i> Contact Owner</a>
            <div class="owner-info">
                <p>Hosted by <span class="owner-name" th:text="${property.owner.fullName}">Owner Name</span></p>
            </div>
        </aside>
    </div>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
