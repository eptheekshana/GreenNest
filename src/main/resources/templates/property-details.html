<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${property.title} + ' - Nboard'">Property Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/modern-ui.css}">
    <style>
        .property-details-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 3rem;
            margin-top: 4rem;
        }
        @media (min-width: 992px) {
            .property-details-grid {
                grid-template-columns: 2fr 1fr;
            }
        }
        .property-main-image {
            width: 100%;
            height: auto;
            max-height: 550px;
            object-fit: cover;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
        }
        .property-info-card {
            background: var(--surface);
            padding: 2.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            position: sticky;
            top: 120px;
        }
    </style>
</head>
<body>
<nav class="top-nav">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
        <a href="/" class="brand">Nboard</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/properties">Listings</a>
            <div sec:authorize="!isAuthenticated()">
                <a href="/login">Login</a>
                <a href="/register" class="nav-button">Register</a>
            </div>
            <div sec:authorize="isAuthenticated()">
                <a href="/owner/dashboard">Dashboard</a>
                <a href="/logout" class="nav-button">Logout</a>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div class="property-details-grid">
        <div>
            <h1 th:text="${property.title}" style="font-size: 2.5rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 0.5rem;">Property Title</h1>
            <p class="property-location" th:text="${property.location}" style="font-size: 1.2rem; color: var(--text-muted); margin-bottom: 2rem;">Location</p>
            <img th:src="${property.primaryPhotoUrl != null ? property.primaryPhotoUrl : '/images/boarding-room.JPEG'}"
                 alt="Property image" class="property-main-image">
            <div style="margin-top: 2rem;">
                <h2>About this property</h2>
                <p th:text="${property.description}" style="line-height: 1.8;">Description of the property.</p>
            </div>
        </div>
        <div class="property-info-card">
            <div style="font-size: 2rem; font-weight: 700; color: var(--primary); margin-bottom: 1rem;"
                 th:text="'LKR ' + ${#numbers.formatDecimal(property.price, 1, 0, 'DEFAULT')}">LKR 0</div>
            <div style="color: var(--text-muted); margin-bottom: 2rem;">per month</div>
            <a href="#" class="btn btn-primary" style="width: 100%; text-align: center;">Contact Owner</a>
            <div style="margin-top: 2rem; text-align: center; color: var(--text-muted);">
                <p style="font-weight: 500;">Hosted by <span th:text="${property.owner.fullName}">Owner Name</span></p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
