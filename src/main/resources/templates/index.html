<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nboard - NSBM Boarding Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/modern-ui.css}">
</head>
<body>
<nav class="top-nav">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
        <a href="/" class="brand">Nboard</a>
        <div class="nav-links">
            <a href="/" class="active">Home</a>
            <a href="/properties">Listings</a>
            <div sec:authorize="!isAuthenticated()">
                <a href="/login">Login</a>
                <a href="/register" class="nav-button">Register</a>
            </div>
            <div sec:authorize="isAuthenticated()">
                <a href="/owner/dashboard">Dashboard</a>
                <a href="/logout" class="nav-button">Logout</a>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <section class="hero">
        <h1>Find Your Perfect Boarding</h1>
        <p>The easiest way to find a boarding place near NSBM Green University.</p>
        <div>
            <a href="/properties" class="btn btn-primary">Browse Listings</a>
            <a href="/register" class="btn btn-secondary" sec:authorize="!isAuthenticated()">Create an Account</a>
        </div>
    </section>

    <section class="featured">
        <h2 style="text-align: center; font-size: 2rem; margin-bottom: 3rem;">Featured Properties</h2>
        <div class="property-grid" th:if="${not #lists.isEmpty(properties)}">
            <div class="property-card" th:each="property : ${properties}">
                <img th:src="${property.primaryPhotoUrl != null ? property.primaryPhotoUrl : '/images/boarding-room.JPEG'}"
                     alt="Property image" class="property-image">
                <div class="property-body">
                    <h3 th:text="${property.title}">Property Title</h3>
                    <p class="property-location" th:text="${property.location}">Location</p>
                    <div class="property-footer">
                        <strong th:text="'LKR ' + ${#numbers.formatDecimal(property.price, 1, 0, 'DEFAULT')}">LKR 0</strong>
                        <a th:href="@{/property-details/{id}(id=${property.id})}">View Details</a>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(properties)}" style="text-align: center; color: var(--text-muted);">
            <p>No properties available at the moment.</p>
        </div>
    </section>
</div>
</body>
</html>
