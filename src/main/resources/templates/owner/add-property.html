<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Property - Nboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/modern-ui.css}">
</head>
<body>
<nav class="top-nav">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
        <a href="/" class="brand">Nboard</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/properties">Listings</a>
            <a href="/owner/dashboard">Dashboard</a>
            <a href="/logout" class="nav-button">Logout</a>
        </div>
    </div>
</nav>

<div class="auth-card">
    <h1>Add a New Property</h1>
    <form th:action="@{/owner/add-property}" th:object="${property}" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}" class="form-control" required rows="4"></textarea>
        </div>
        <div class="form-group">
            <label for="price">Price (LKR)</label>
            <input type="number" id="price" th:field="*{price}" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" th:field="*{location}" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="primaryPhoto">Primary Photo</label>
            <input type="file" id="primaryPhoto" name="primaryPhoto" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Submit for Approval</button>
    </form>
</div>
</body>
</html>
