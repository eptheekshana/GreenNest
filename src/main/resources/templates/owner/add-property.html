<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Property - Nboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/home-simplified.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="container">
    <nav class="top-nav">
        <a href="/" class="brand">Nboard</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/properties">Listings</a>
            <a href="/owner/dashboard">Dashboard</a>
            <a href="/logout" class="nav-button">Logout</a>
        </div>
    </nav>

    <div class="auth-card" style="margin: 2rem auto;">
        <h1>Add a New Property</h1>

        <form th:action="@{/owner/add-property}" th:object="${property}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" th:field="*{title}" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" class="form-control" required></textarea>
            </div>
            <div class="form-group">
                <label for="price">Price (LKR)</label>
                <input type="number" id="price" th:field="*{price}" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" th:field="*{location}" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="primaryPhoto">Primary Photo</label>
                <input type="file" id="primaryPhoto" name="primaryPhoto" class="form-control" required>
            </div>
            <button type="submit" class="btn-primary">Submit for Approval</button>
        </form>
    </div>
</div>
</body>
</html>
