<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard - Nboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/home-simplified.css}">
    <link rel="stylesheet" th:href="@{/css/owner.css}">
</head>
<body>
<div class="container">
    <nav class="top-nav">
        <a href="/" class="brand">Nboard</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/properties">Listings</a>
            <a href="/owner/dashboard" class="active">Dashboard</a>
            <a href="/logout" class="nav-button">Logout</a>
        </div>
    </nav>

    <div class="header">
        <h1>Your Properties</h1>
        <a href="/owner/add-property" class="btn-primary">Add New Property</a>
    </div>

    <div class="property-list" th:if="${not #lists.isEmpty(properties)}">
        <div class="property-item" th:each="property : ${properties}">
            <div>
                <h3 th:text="${property.title}">Property Title</h3>
                <p th:text="${property.location}">Location</p>
            </div>
            <div class="status" th:classappend="${property.approved} ? 'approved' : 'pending'"
                 th:text="${property.approved} ? 'Approved' : 'Pending Approval'">
                Status
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(properties)}">
        <p style="text-align: center; color: #6c757d;">You haven't added any properties yet.</p>
    </div>
</div>
</body>
</html>
