<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard - Nboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/modern-ui.css}">
    <style>
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 3rem 0;
        }
        .property-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            padding: 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }
        .status { font-weight: 600; }
        .status.pending { color: #ffc107; }
        .status.approved { color: #28a745; }
    </style>
</head>
<body>
<nav class="top-nav">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
        <a href="/" class="brand">Nboard</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/properties">Listings</a>
            <a href="/owner/dashboard" class="active">Dashboard</a>
            <a href="/logout" class="nav-button">Logout</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="dashboard-header">
        <h1 style="font-size: 2.5rem; margin: 0;">Your Properties</h1>
        <a href="/owner/add-property" class="btn btn-primary">Add New Property</a>
    </div>

    <div th:if="${not #lists.isEmpty(properties)}">
        <div class="property-item" th:each="property : ${properties}">
            <div>
                <h3 th:text="${property.title}" style="margin: 0; font-size: 1.2rem;">Property Title</h3>
                <p th:text="${property.location}" style="color: var(--text-muted); margin: 0.25rem 0 0;">Location</p>
            </div>
            <div class="status" th:classappend="${property.approved} ? 'approved' : 'pending'"
                 th:text="${property.approved} ? 'Approved' : 'Pending Approval'">Status</div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(properties)}" style="text-align: center; color: var(--text-muted); padding: 3rem 0;">
        <p>You haven't added any properties yet.</p>
    </div>
</div>
</body>
</html>
