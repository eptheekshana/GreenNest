<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard - Nboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/modern-ui.css}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 4rem 0 3rem;
        }
        .property-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            padding: 1.5rem 2rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            margin-bottom: 1.5rem;
            transition: var(--transition-slow);
        }
        .property-item:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-3px);
        }
        .status { font-weight: 600; padding: 0.4rem 0.8rem; border-radius: 999px; font-size: 0.8rem; }
        .status.pending { background-color: #fffbeb; color: #b45309; }
        .status.approved { background-color: var(--primary-light); color: var(--primary-dark); }
    </style>
</head>
<body>
<nav class="top-nav">
    <div class="container">
        <a href="/" class="brand">Nboard</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/properties">Listings</a>
            <a href="/owner/dashboard" class="active">Dashboard</a>
            <div sec:authorize="isAuthenticated()" class="nav-auth-buttons">
                <a href="/logout" class="nav-button">Logout</a>
            </div>
        </div>
    </div>
</nav>

<main class="container" data-reveal>
    <div class="dashboard-header">
        <h1 style="font-size: 2.8rem; font-weight: 800; letter-spacing: -0.03em; margin: 0;">Your Properties</h1>
        <a href="/owner/add-property" class="btn btn-primary"><i class="ph-bold ph-plus"></i> Add New Property</a>
    </div>

    <div th:if="${not #lists.isEmpty(properties)}">
        <div class="property-item" th:each="property, iterStat : ${properties}" data-reveal th:style="'transition-delay: ' + ${iterStat.index * 100} + 'ms'">
            <div>
                <h3 th:text="${property.title}" style="margin: 0; font-size: 1.2rem; font-weight: 600;">Property Title</h3>
                <p th:text="${property.location}" style="color: var(--text-muted); margin: 0.25rem 0 0;">Location</p>
            </div>
            <div class="status" th:classappend="${property.approved} ? 'approved' : 'pending'"
                 th:text="${property.approved} ? 'Approved' : 'Pending Approval'">Status</div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(properties)}" class="card" style="text-align: center; padding: 4rem; color: var(--text-muted);" data-reveal>
        <p style="font-size: 1.1rem;">You haven't added any properties yet.</p>
        <a href="/owner/add-property" class="btn btn-primary" style="margin-top: 1rem;">Add Your First Property</a>
    </div>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
